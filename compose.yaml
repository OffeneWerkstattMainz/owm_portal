services:
  web:
    image: ${OWM_PORTAL_IMAGE:-ghcr.io/offenewerkstattmainz/owm-portal:0.10.0}
    restart: unless-stopped
    environment:
      ALLOWED_HOSTS: "${DOMAIN}"
      DB_HOST: db
      RQ_HOST: valkey
      SECRET_KEY_FILE: "/data/secret_key.txt"
      STATIC_ROOT: "/data/static"
      CREATE_VOTING_ACCESS_CODE:
      WEB_CONCURRENCY:
      WEBLING_API_KEY:
      SIGNUP_PENDING_GROUP_ID:
      SIGNUP_CONFIRMED_GROUP_ID:
      SIGNUP_NOTIFY_EMAILS:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USER:
      SMTP_PASSWORD:
      EMAIL_FROM:
    volumes:
      - ${DATA_DIR:-./data}/web:/data
      - web-static:/data/static
    depends_on:
      - db
      - valkey
    labels:
      caddy: "${DOMAIN}"
      caddy.reverse_proxy: "{{ upstreams 8000 }}"

  worker:
    image: ${OWM_PORTAL_IMAGE:-ghcr.io/offenewerkstattmainz/owm-portal:0.10.0}
    restart: unless-stopped
    scale: ${WORKER_CONCURRENCY:-2}
    environment:
      DB_HOST: db
      RQ_HOST: valkey
      SECRET_KEY_FILE: "/data/secret_key.txt"
      WEBLING_API_KEY:
    volumes:
      - ${DATA_DIR:-./data}/web:/data
      - web-static:/data/static
    depends_on:
      - db
      - valkey
    command:
      - worker

  signup:
    image: ${OWM_PORTAL_IMAGE:-ghcr.io/offenewerkstattmainz/owm-portal:0.10.0}
    restart: unless-stopped
    environment:
      DB_HOST: db
      SECRET_KEY_FILE: "/data/secret_key.txt"
      WEBLING_API_KEY:
      SIGNUP_PENDING_GROUP_ID:
      SIGNUP_CONFIRMED_GROUP_ID:
      SIGNUP_BASE_URL: "https://${DOMAIN}"
      SIGNUP_NOTIFY_EMAILS:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USER:
      SMTP_PASSWORD:
      EMAIL_FROM:
    volumes:
      - ${DATA_DIR:-./data}/web:/data
    depends_on:
      - db
      - web
    command:
      - manage
      - signup_process
      - --loop

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ${DATA_DIR:-./data}/db:/var/lib/postgresql/data
      - ./docker/postgres-init.d/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: pg_isready -U postgres
      start_period: "30s"
      start_interval: "2s"

  valkey:
    image: valkey/valkey:7.2

  caddy:
    image: lucaslorentz/caddy-docker-proxy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-./data}/caddy:/data
    profiles:
      - proxy
    labels:
      caddy.email: "${LETSENCRYPT_EMAIL}"

volumes:
  web-static:
